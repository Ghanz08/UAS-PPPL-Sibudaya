base.url=https://www.sibudaya.cloud/sibudaya
default.timeout.seconds=10

# QA-4 live automation data. Override with -Dkey=value or ENV KEY_WITH_UNDERSCORES.
# Required for M5F1 admin dashboard cases.
qa4.admin.identifier=<admin-email>
qa4.admin.password=<admin-password>

# Required for M4F3 lembaga submission detail/revision cases.
qa4.lembaga.identifier=<nik-lembaga-or-email>
qa4.lembaga.password=<lembaga-password>
qa4.timeline.pengajuan.id=<pengajuan-id-with-status-history>
qa4.revisi.pengajuan.id=<pengajuan-id-direvisi>
qa4.selesai.pengajuan.id=<pengajuan-id-selesai>
qa4.ditolak.pengajuan.id=<pengajuan-id-ditolak>

# When true and target IDs above are empty/placeholders, QA-4 creates test data through UI login/form flows.
qa4.auto.create.test.data=false

# Enable only when running against a database with no pengajuan data.
qa4.empty.dashboard.enabled=false
